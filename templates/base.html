<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Study Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }

        .sidebar {
            width: 240px;
            min-height: 100vh;
            background: linear-gradient(180deg, #1a1f3c 0%, #2d3561 100%);
            position: fixed;
            top: 0; left: 0;
            z-index: 100;
            box-shadow: 3px 0 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        .sidebar-brand {
            padding: 24px 20px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-brand h5 {
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .sidebar-brand small {
            color: rgba(255,255,255,0.45);
            font-size: 0.72rem;
        }

        .sidebar .nav-link {
            color: rgba(255,255,255,0.65);
            padding: 11px 20px;
            border-radius: 8px;
            margin: 2px 10px;
            font-size: 0.88rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }

        .sidebar .nav-link i { font-size: 1rem; }

        .sidebar-footer {
            margin-top: auto;
            padding: 12px 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-footer .nav-link {
            color: rgba(255,100,100,0.8) !important;
        }

        .sidebar-footer .nav-link:hover {
            background: rgba(255,100,100,0.15) !important;
            color: #ff6b6b !important;
        }

        .main-content {
            margin-left: 240px;
            padding: 28px 32px;
            min-height: 100vh;
        }

        .page-header { margin-bottom: 24px; }
        .page-header h4 { font-weight: 700; color: #1a1f3c; margin: 0; }
        .page-header p { color: #6c757d; margin: 2px 0 0; font-size: 0.88rem; }

        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }

        .card-header {
            background: #fff;
            border-bottom: 1px solid #f0f0f0;
            border-radius: 12px 12px 0 0 !important;
            padding: 16px 20px;
            font-weight: 600;
            color: #1a1f3c;
        }

        .stat-card { border-radius: 12px; padding: 22px; color: #fff; border: none; }

        .stat-card .stat-icon {
            width: 48px; height: 48px;
            border-radius: 10px;
            background: rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem;
        }

        .stat-card h3 { font-weight: 700; font-size: 2rem; margin: 8px 0 2px; }
        .stat-card p { margin: 0; opacity: 0.85; font-size: 0.88rem; }

        .btn-primary { background: #2d3561; border-color: #2d3561; }
        .btn-primary:hover { background: #1a1f3c; border-color: #1a1f3c; }

        .badge-active { background: #d1fae5; color: #065f46; }
        .badge-inactive { background: #fee2e2; color: #991b1b; }

        .table th {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6c757d;
            font-weight: 600;
            border-top: none;
        }

        .table td { vertical-align: middle; font-size: 0.9rem; }
        .action-btn { padding: 4px 10px; font-size: 0.8rem; border-radius: 6px; }
        .toast-container { z-index: 9999; }

        .modal-header { background: #1a1f3c; color: #fff; border-radius: 12px 12px 0 0; }
        .modal-header .btn-close { filter: invert(1); }
        .modal-content { border-radius: 12px; border: none; }

        .difficulty-badge {
            display: inline-block;
            width: 28px; height: 28px;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-size: 0.78rem;
            font-weight: 700;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="sidebar-brand">
        <h5><i class="bi bi-journal-bookmark-fill me-2"></i>Study Planner</h5>
        <small>Adaptive Learning System</small>
    </div>
    <nav class="mt-3">
        <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
            <i class="bi bi-grid-1x2"></i> Dashboard
        </a>
        <a href="/tests-page" class="nav-link {% if active_page == 'tests' %}active{% endif %}">
            <i class="bi bi-clipboard2-check"></i> Tests
        </a>
        <a href="/subjects-page" class="nav-link {% if active_page == 'subjects' %}active{% endif %}">
            <i class="bi bi-book"></i> Subjects
        </a>
        <a href="/topics-page" class="nav-link {% if active_page == 'topics' %}active{% endif %}">
            <i class="bi bi-list-task"></i> Topics
        </a>
        <a href="/mocktests-page" class="nav-link {% if active_page == 'mocktests' %}active{% endif %}">
            <i class="bi bi-graph-up"></i> Performance Analyzer
        </a>
        <a href="/schedules-page" class="nav-link {% if active_page == 'schedules' %}active{% endif %}">
            <i class="bi bi-calendar2-week"></i> Schedules
        </a>
    </nav>
    <div class="sidebar-footer">
        <a href="/logout" class="nav-link">
            <i class="bi bi-box-arrow-left"></i> Logout
        </a>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">
    {% block content %}{% endblock %}
</div>

<!-- Toast Notification -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast align-items-center border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body fw-semibold" id="toastMessage"></div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    function showToast(message, type = "success") {
        const toast = document.getElementById("appToast");
        const msg = document.getElementById("toastMessage");
        toast.className = `toast align-items-center border-0 text-bg-${type}`;
        msg.textContent = message;
        new bootstrap.Toast(toast, { delay: 3000 }).show();
    }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
