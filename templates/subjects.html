{% extends "base.html" %}
{% block content %}

<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <h4><i class="bi bi-book me-2"></i>Subjects</h4>
        <p>Manage subjects linked to tests</p>
    </div>
    <button class="btn btn-primary" onclick="openModal()">
        <i class="bi bi-plus-lg me-1"></i> Add Subject
    </button>
</div>

<!-- Filter Bar -->
<div class="card mb-3">
    <div class="card-body py-2 px-3 d-flex align-items-center gap-3">
        <label class="fw-semibold text-nowrap mb-0" style="font-size:0.88rem;">Filter by Test:</label>
        <select id="filterTest" class="form-select form-select-sm w-auto">
            <option value="">All Tests</option>
        </select>
        <input type="text" id="searchInput" class="form-control form-control-sm ms-auto w-auto" placeholder="Search...">
    </div>
</div>

<div class="card">
    <div class="card-header">All Subjects</div>
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr>
                    <th class="ps-4">ID</th>
                    <th>Name</th>
                    <th>Test</th>
                    <th>Status</th>
                    <th>Created At</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="subjectsBody">
                <tr><td colspan="6" class="text-center py-4 text-muted">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add / Edit Modal -->
<div class="modal fade" id="subjectModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title" id="modalTitle">Add Subject</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="subjectId">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Test <span class="text-danger">*</span></label>
                    <select id="subjectTestId" class="form-select">
                        <option value="">Select Test</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Subject Name <span class="text-danger">*</span></label>
                    <input type="text" id="subjectName" class="form-control" placeholder="e.g. Mathematics">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Status</label>
                    <select id="subjectStatus" class="form-select">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary btn-sm" onclick="saveSubject()">
                    <i class="bi bi-check-lg me-1"></i> Save
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title">Confirm Delete</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <i class="bi bi-exclamation-triangle-fill text-warning fs-1"></i>
                <p class="mt-2 mb-0">Are you sure you want to delete this subject?</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-danger btn-sm" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
let allSubjects = [];
let testsMap = {};
let deleteId = null;
const subjectModal = new bootstrap.Modal(document.getElementById("subjectModal"));
const deleteModal = new bootstrap.Modal(document.getElementById("deleteModal"));

function loadTests() {
    $.get("/tests", function (tests) {
        testsMap = {};
        tests.forEach(t => testsMap[t.id] = t.name);

        // Populate filter dropdown
        const filterOpts = tests.map(t => `<option value="${t.id}">${t.name}</option>`).join("");
        $("#filterTest").append(filterOpts);

        // Populate modal dropdown
        const modalOpts = tests.map(t => `<option value="${t.id}">${t.name}</option>`).join("");
        $("#subjectTestId").append(modalOpts);
    });
}

function loadSubjects() {
    $.get("/subjects", function (data) {
        allSubjects = data;
        renderTable(data);
    });
}

function renderTable(data) {
    if (!data.length) {
        $("#subjectsBody").html(`<tr><td colspan="6" class="text-center py-4 text-muted">No subjects found</td></tr>`);
        return;
    }
    const rows = data.map(s => `
        <tr>
            <td class="ps-4 text-muted">#${s.id}</td>
            <td class="fw-semibold">${s.name}</td>
            <td><span class="badge bg-light text-dark border">${testsMap[s.test_id] ?? `Test #${s.test_id}`}</span></td>
            <td><span class="badge rounded-pill badge-${s.status === 'active' ? 'active' : 'inactive'}">${s.status ?? "—"}</span></td>
            <td class="text-muted">${s.created_at ?? "—"}</td>
            <td>
                <button class="btn btn-outline-primary action-btn me-1" onclick="editSubject(${s.id}, ${s.test_id}, '${s.name}', '${s.status}')">
                    <i class="bi bi-pencil"></i> Edit
                </button>
                <button class="btn btn-outline-danger action-btn" onclick="deleteSubject(${s.id})">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        </tr>`).join("");
    $("#subjectsBody").html(rows);
}

function openModal() {
    $("#modalTitle").text("Add Subject");
    $("#subjectId").val("");
    $("#subjectTestId").val("");
    $("#subjectName").val("");
    $("#subjectStatus").val("active");
    subjectModal.show();
}

function editSubject(id, testId, name, status) {
    $("#modalTitle").text("Edit Subject");
    $("#subjectId").val(id);
    $("#subjectTestId").val(testId);
    $("#subjectName").val(name);
    $("#subjectStatus").val(status);
    subjectModal.show();
}

function saveSubject() {
    const id = $("#subjectId").val();
    const payload = {
        test_id: parseInt($("#subjectTestId").val()),
        name: $("#subjectName").val().trim(),
        status: $("#subjectStatus").val()
    };

    if (!payload.test_id || !payload.name) {
        showToast("Test and Subject Name are required.", "warning");
        return;
    }

    const url = id ? `/subjects/${id}` : "/subjects";
    const method = id ? "PUT" : "POST";

    $.ajax({
        url, method,
        contentType: "application/json",
        data: JSON.stringify(payload),
        success: function () {
            subjectModal.hide();
            showToast(id ? "Subject updated!" : "Subject created!");
            loadSubjects();
        },
        error: function () { showToast("Something went wrong.", "danger"); }
    });
}

function deleteSubject(id) {
    deleteId = id;
    deleteModal.show();
}

function confirmDelete() {
    $.ajax({
        url: `/subjects/${deleteId}`,
        method: "DELETE",
        success: function () {
            deleteModal.hide();
            showToast("Subject deleted.", "danger");
            loadSubjects();
        },
        error: function () { showToast("Delete failed.", "danger"); }
    });
}

// Filter by test
$("#filterTest").on("change", function () {
    const testId = $(this).val();
    const filtered = testId ? allSubjects.filter(s => s.test_id == testId) : allSubjects;
    renderTable(filtered);
});

// Search
$("#searchInput").on("input", function () {
    const q = $(this).val().toLowerCase();
    $("#subjectsBody tr").each(function () {
        $(this).toggle($(this).text().toLowerCase().includes(q));
    });
});

$(document).ready(function () {
    loadTests();
    loadSubjects();
});
</script>
{% endblock %}
